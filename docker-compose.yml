name: liquibase_poc

services:
  postgres:
    image: postgres:16.11
    container_name: liquibase_poc_postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
      LIQUIBASE_PASSWORD: ${MIGRATION_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD}
      LIMITED_PASSWORD: ${LIMITED_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d ${DATABASE_NAME}"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  pgdata:
