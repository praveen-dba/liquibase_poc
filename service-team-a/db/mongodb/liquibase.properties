# MongoDB for service-team-a. The database name is the one in the connection URL.
# Tracking data is stored as collections in that database.
changeLogFile=root-changelog.yaml
searchPath=service-team-a/db/mongodb
databaseChangeLogTableName=serviceteama_mongodb_databasechangelog
databaseChangeLogLockTableName=serviceteama_mongodb_databasechangelock
liquibase.mongodb.adjustTrackingTablesOnStartup=true
showBanner=false
