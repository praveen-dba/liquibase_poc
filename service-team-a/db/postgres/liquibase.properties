# PostgreSQL for service-team-a. Run from the repo root, or call scripts/lb.sh.
# The JDBC URL selects the database. liquibaseSchemaName is the schema inside it.
# URL, username, and password come from the environment.
changeLogFile=root-changelog.yaml
searchPath=service-team-a/db/postgres
databaseChangeLogTableName=serviceteama_postgres_databasechangelog
databaseChangeLogLockTableName=serviceteama_postgres_databasechangelock
liquibaseSchemaName=app
defaultSchemaName=app
parameter.schemaName=app
driver=org.postgresql.Driver
showBanner=false
