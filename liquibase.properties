# Connection username, password, and URL are supplied by scripts/common.sh
# as LIQUIBASE_COMMAND_URL, LIQUIBASE_COMMAND_USERNAME, and
# LIQUIBASE_COMMAND_PASSWORD. They are intentionally not stored here.
# Do not also export LIQUIBASE_USERNAME or LIQUIBASE_PASSWORD. Liquibase 5
# treats unknown LIQUIBASE_* variables as a configuration error.

changeLogFile=changelog/db.changelog-master.yaml
searchPath=.

# Tracking tables live here, separate from application objects.
liquibaseSchemaName=liquibase

# Unqualified objects in structured changelogs go to this schema.
# SQL changesets in this repo still schema-qualify every name.
defaultSchemaName=app

logLevel=INFO
liquibase.showBanner=false
