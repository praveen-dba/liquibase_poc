# Append new changesets at the bottom. Do not reorder or edit a changeset
# after it has been applied to a shared database. Identity is filepath + id + author.
databaseChangeLog:
  - include:
      file: changes/001-create-customers.sql
      relativeToChangelogFile: true
  - include:
      file: changes/002-create-orders.sql
      relativeToChangelogFile: true
  - include:
      file: changes/003-seed-customers.sql
      relativeToChangelogFile: true
  - include:
      file: changes/004-add-customer-status.sql
      relativeToChangelogFile: true
  - changeSet:
      id: 005-tag-v1_0_0
      author: praveen
      comment: Release marker. keepTagOnRollback retains this row when rolling back to v1.0.0.
      changes:
        - tagDatabase:
            tag: v1.0.0
            keepTagOnRollback: true
  - include:
      file: changes/006-create-payments.sql
      relativeToChangelogFile: true
  - include:
      file: changes/007-customer-count-fn.sql
      relativeToChangelogFile: true
