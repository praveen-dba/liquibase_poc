# service-team-b
#
# Pass one engine file to Liquibase. scripts/lb.sh and Jenkinsfile do that.
#   db/mysql/liquibase.properties
#   db/postgres/liquibase.properties
#   db/mongodb/liquibase.properties
#
# Each engine has its own tracking table. Team A cannot see these rows.
#   mysql     serviceteamb_mysql_databasechangelog
#             serviceteamb_mysql_databasechangelock
#   postgres  serviceteamb_postgres_databasechangelog
#             serviceteamb_postgres_databasechangelock
#   mongodb   serviceteamb_mongodb_databasechangelog
#             serviceteamb_mongodb_databasechangelock
#
# The connection URL, username, and password are not in this tree.
# Local runs read them from .env. Jenkins exports LIQUIBASE_COMMAND_URL,
# LIQUIBASE_COMMAND_USERNAME, and LIQUIBASE_COMMAND_PASSWORD.
