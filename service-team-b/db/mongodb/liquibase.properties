# MongoDB for service-team-b. The database name is the one in the connection URL.
# Tracking data is stored as collections in that database.
changeLogFile=root-changelog.yaml
searchPath=service-team-b/db/mongodb
databaseChangeLogTableName=serviceteamb_mongodb_databasechangelog
databaseChangeLogLockTableName=serviceteamb_mongodb_databasechangelock
liquibase.mongodb.adjustTrackingTablesOnStartup=true
showBanner=false
