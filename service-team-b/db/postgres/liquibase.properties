# PostgreSQL for service-team-b. Run from the repo root, or call scripts/lb.sh.
# The JDBC URL selects the database. liquibaseSchemaName is the schema inside it.
# URL, username, and password come from the environment.
changeLogFile=root-changelog.yaml
searchPath=service-team-b/db/postgres
databaseChangeLogTableName=serviceteamb_postgres_databasechangelog
databaseChangeLogLockTableName=serviceteamb_postgres_databasechangelock
liquibaseSchemaName=app
defaultSchemaName=app
parameter.schemaName=app
driver=org.postgresql.Driver
showBanner=false
